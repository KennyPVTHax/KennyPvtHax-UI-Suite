
name: KennyPvtHax Native Build

on:
  workflow_dispatch:
    inputs:
      isolation:
        description: "Presentation-only diagnosis; full preserves all features"
        type: choice
        default: full
        options: [full, no_audio, no_artwork, no_preferences, classic, no_menu]

permissions:
  contents: read

jobs:
  test:
    name: Host UI regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Regression fixtures compare genuine historical renderer/binding code.
          fetch-depth: 0
      - name: Install host test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y g++ zlib1g-dev libssl-dev python3-pil
      - name: Run public-source ASan and UBSan suites
        run: |
          python3 tools/generate_embedded_media.py --output .build/embedded-media
          python3 tests/kenny_repository_media_check.py
          python3 tests/run_ui_regressions.py --sanitizers \
            --user-media "$GITHUB_WORKSPACE" \
            --presentation-media "$GITHUB_WORKSPACE" \
            --embedded-media "$GITHUB_WORKSPACE/.build/embedded-media" \
            --label ci-ui-regressions

  build:
    needs: test
    name: Build ARM64 Library
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      NDK_VERSION: "25.2.9519653"
      KPH_ISOLATION: ${{ inputs.isolation || 'full' }}
      KPH_SYMBOLS_AGE_RECIPIENT: ${{ secrets.KPH_SYMBOLS_AGE_RECIPIENT }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          NDK="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          test -x "$NDK/ndk-build"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          "$NDK/ndk-build" --version

      - name: Verify project and SDK
        shell: bash
        run: |
          set -e
          test -f jni/Android.mk
          test -f jni/Application.mk
          test -f jni/main.cpp

          for f in \
            PUBGM_BangJO.hpp \
            PUBGM_Basic.cpp \
            PUBGM_Basic_functions.cpp \
            PUBGM_CoreUObject_functions.cpp \
            PUBGM_Engine_functions.cpp \
            PUBGM_ShadowTrackerExtra_functions.cpp \
            PUBGM_Client_functions.cpp
          do
            test -s "jni/SDK/$f" || {
              echo "Missing SDK file: $f"
              exit 1
            }
          done

          echo "SDK entry files verified."

      - name: Build KennyPvtHax SO
        shell: bash
        run: |
          set -euo pipefail
          # Android.mk generates the complete pack from committed inventory/assets.
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            KPH_DIAGNOSTICS=1 \
            KPH_BUILD_ID="$GITHUB_SHA" \
            KPH_ISOLATION="$KPH_ISOLATION" \
            -j2

      - name: Verify compiled library
        shell: bash
        run: |
          set -e
          SO="libs/arm64-v8a/libAnoy.so"
          test -s "$SO"

          file "$SO"
          sha256sum "$SO"
          python3 tools/verify_embedded_library.py \
            --library "$SO" --media .build/embedded-media \
            --output .verification/embedded-media-verification.json

          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          mkdir -p .verification
          # grep -q closes a pipe early; LLVM readelf can then exit 74 under
          # pipefail even when the matching ELF field is present.
          "$READELF" -h "$SO" > .verification/elf-header.txt
          grep -E 'Class:|Machine:' .verification/elf-header.txt
          grep -q 'AArch64' .verification/elf-header.txt
          SYMBOLS="obj/local/arm64-v8a/libAnoy.so"
          test -s "$SYMBOLS"
          "$READELF" -S "$SYMBOLS" > .verification/symbol-sections.txt
          grep -q '.debug_info' .verification/symbol-sections.txt
          "$READELF" -Ws "$SO" > .verification/runtime-symbols.txt
          grep -q 'KennyPvtHaxDiagnosticsExportToFd' .verification/runtime-symbols.txt
          {
            echo "commit=$GITHUB_SHA"
            echo "ndk=$NDK_VERSION"
            echo "isolation=$KPH_ISOLATION"
            sha256sum "$SO" "$SYMBOLS"
            "$READELF" -n "$SO"
            "$READELF" -n "$SYMBOLS"
          } > .verification/build-info.txt

          echo "ARM64 native library verified."

      - name: Upload compiled SO
        uses: actions/upload-artifact@v4
        with:
          name: KennyPvtHax-ARM64-SO
          path: |
            libs/arm64-v8a/libAnoy.so
            .verification/build-info.txt
            .verification/embedded-media-verification.json
            assets/embedded-media-inventory.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      # This repository is public: never upload plaintext unstripped symbols.
      # Set an age public recipient secret to allow only its private-key owner
      # to decrypt the additional debugging artifact.
      - name: Encrypt matching private symbols when configured
        if: env.KPH_SYMBOLS_AGE_RECIPIENT != ''
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y age
          tar -czf .verification/symbols.tar.gz obj/local/arm64-v8a/libAnoy.so .verification/build-info.txt
          age -r "$KPH_SYMBOLS_AGE_RECIPIENT" -o .verification/symbols.tar.gz.age .verification/symbols.tar.gz
          rm .verification/symbols.tar.gz

      - name: Upload encrypted symbols only
        if: env.KPH_SYMBOLS_AGE_RECIPIENT != ''
        uses: actions/upload-artifact@v4
        with:
          name: KennyPvtHax-encrypted-debug-symbols
          path: .verification/symbols.tar.gz.age
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          
