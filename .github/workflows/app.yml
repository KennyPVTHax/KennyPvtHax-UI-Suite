name: Android UI Suite APK
on:
  push:
    branches: [main]
    paths: ['app-ui/**', 'shared/**', 'tools/**', '.github/workflows/app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 tools/check_app_screens.py
      - run: python3 tools/verify_suite.py
      - run: python3 app-ui/build-debug.py --sdk "$ANDROID_HOME"
      - name: APK metadata
        run: |
          sha256sum app-ui/build/manual/KennyPvtHax-UI-Suite-debug.apk | tee app-ui/build/manual/SHA256SUMS
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging app-ui/build/manual/KennyPvtHax-UI-Suite-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KennyPvtHax-UI-Suite-APK
          path: |
            app-ui/build/manual/KennyPvtHax-UI-Suite-debug.apk
            app-ui/build/manual/SHA256SUMS
          if-no-files-found: error
  emulator:
    needs: app
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: KennyPvtHax-UI-Suite-APK
          path: apk
      - name: Enable runner KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Android gallery and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r apk/KennyPvtHax-UI-Suite-debug.apk
            python3 app-ui/tests/device_smoke.py
            python3 tools/capture_app.py
            python3 app-ui/tests/phase2_device.py --allow-data-reset
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Actual-Android-UI-Captures
          path: |
            shared/visual-reference/app-*.png
            shared/visual-reference/app-device-smoke.json
            shared/visual-reference/phase2/app/*.png
            shared/visual-reference/phase2/app/checks.json
          if-no-files-found: warn
