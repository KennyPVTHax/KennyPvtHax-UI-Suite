name: Android UI Suite APK
on:
  push:
    branches: [main]
    paths: ['app-ui/**', 'shared/**', 'tools/**', '.github/workflows/app.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 tools/verify_suite.py
      - run: python3 app-ui/build-debug.py --sdk "$ANDROID_HOME"
      - name: APK metadata
        run: |
          sha256sum app-ui/build/manual/KennyPvtHax-UI-Suite-debug.apk | tee app-ui/build/manual/SHA256SUMS
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging app-ui/build/manual/KennyPvtHax-UI-Suite-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KennyPvtHax-UI-Suite-APK
          path: |
            app-ui/build/manual/KennyPvtHax-UI-Suite-debug.apk
            app-ui/build/manual/SHA256SUMS
          if-no-files-found: error
